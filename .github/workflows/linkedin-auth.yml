name: linkedin-auth

# Troca o código de autorização do LinkedIn por um token e grava os secrets.
# Passo a passo no README (seção LinkedIn). O código vale poucos minutos e só funciona com o client secret.
on:
  workflow_dispatch:
    inputs:
      code:
        description: 'Código que apareceu na página de retorno (velatrix-blog.pages.dev/linkedin-retorno)'
        required: true

permissions:
  contents: read

jobs:
  trocar:
    runs-on: ubuntu-latest
    steps:
      - name: Trocar código por token e gravar secrets
        env:
          CODE: ${{ inputs.code }}
          CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
          REDIRECT: ${{ vars.LINKEDIN_REDIRECT_URI || 'https://velatrix-blog.pages.dev/linkedin-retorno/' }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$CLIENT_ID" ] || [ -z "$CLIENT_SECRET" ] || [ -z "$GH_TOKEN" ]; then
            echo "::error::Faltam secrets: LINKEDIN_CLIENT_ID, LINKEDIN_CLIENT_SECRET e GH_PAT (com permissão Secrets: write)"; exit 1
          fi
          resp=$(curl -sS -X POST https://www.linkedin.com/oauth/v2/accessToken \
            --data-urlencode grant_type=authorization_code \
            --data-urlencode "code=$CODE" \
            --data-urlencode "redirect_uri=$REDIRECT" \
            --data-urlencode "client_id=$CLIENT_ID" \
            --data-urlencode "client_secret=$CLIENT_SECRET")
          token=$(echo "$resp" | jq -r '.access_token // empty')
          if [ -z "$token" ]; then echo "::error::LinkedIn não devolveu token: $(echo "$resp" | jq -c '{error, error_description}')"; exit 1; fi
          echo "::add-mask::$token"
          sub=$(curl -sS -H "Authorization: Bearer $token" https://api.linkedin.com/v2/userinfo | jq -r '.sub // empty')
          if [ -z "$sub" ]; then echo "::error::não consegui ler o perfil (escopo openid profile?)"; exit 1; fi
          gh secret set LINKEDIN_ACCESS_TOKEN --repo "$REPO" --body "$token"
          gh secret set LINKEDIN_AUTHOR_URN --repo "$REPO" --body "urn:li:person:$sub"
          gh secret set LINKEDIN_TOKEN_CREATED_AT --repo "$REPO" --body "$(date -u +%F)"
          echo "Token gravado. Vence em $(echo "$resp" | jq -r '.expires_in / 86400 | floor') dias."
