  - id: li-005-reforma
    pilar: educativo
    fonte: reforma-tributaria-cronograma-cbs-ibs
    texto: |
      2027 está a um mês de distância. E é o ano em que o PIS e a Cofins deixam de existir.

      O cronograma da reforma tributária do consumo, pela EC 132/2023 e pela LC 214/2025:

      2026: teste. CBS de 0,9% e IBS de 0,1% destacados na nota, com recolhimento dispensado para quem cumpre as obrigações acessórias.

      2027: a CBS passa a ser cobrada e o PIS e a Cofins são extintos. O IBS segue em teste.

      2029 a 2032: ICMS e ISS caem de forma escalonada (10%, 20%, 30% e 40% de redução) enquanto o IBS cresce.

      2033: ICMS e ISS deixam de existir.

      Três consequências práticas para quem assessora empresas:

      → O crédito passa a ser financeiro e amplo. Cadastro e documento fiscal corretos viram questão de sobrevivência.
      → O split payment separa o imposto no momento do pagamento. O capital de giro do cliente precisa ser recalculado.
      → As teses sobre PIS e Cofins continuam valendo para os períodos não prescritos. A extinção não apaga recolhimentos indevidos já feitos.

      Para o contador e o advogado, isso não é só obrigação nova. É uma agenda de trabalho com cada cliente da carteira.

      O cronograma completo, ano a ano, está no artigo do primeiro comentário.
    hashtags: ["#ReformaTributaria", "#CBS", "#IBS", "#Contabilidade", "#DireitoTributario"]
    primeiro_comentario: "Cronograma completo da reforma tributária: https://velatrix-blog.pages.dev/blog/reforma-tributaria-cronograma-cbs-ibs/"
