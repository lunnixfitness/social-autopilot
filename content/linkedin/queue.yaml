  - id: li-001-tema69
    pilar: educativo
    fonte: exclusao-icms-base-pis-cofins-tema-69
    texto: |
      O ICMS destacado na nota ainda está inflando o PIS/Cofins de muita empresa.

      E boa parte dos contadores e advogados tributaristas já sabe disso. O que falta é tempo para revisar a carteira inteira.

      O que está definido:

      → Em 15/03/2017, no Tema 69 (RE 574.706), o STF fixou que o ICMS não compõe a base de cálculo do PIS e da Cofins.
      → Na modulação, a exclusão vale a partir de 15/03/2017, ressalvadas as ações e pedidos administrativos protocolados até essa data.
      → O valor que sai da base é o ICMS destacado na nota fiscal, não só o recolhido.
      → No Tema 1.279, o STF fechou a porta para fatos geradores anteriores a 15/03/2017 sem ação ou pedido até aquela data.
      → A restituição prescreve em cinco anos (CTN, art. 168).

      E um detalhe que muita revisão esquece: desde maio de 2023, pela Lei 14.592/2023, o ICMS das compras também saiu da base dos créditos de PIS/Cofins no regime não cumulativo. A revisão precisa separar os dois períodos.

      O trabalho real não está na tese. Está no recálculo mês a mês, com EFD-Contribuições, EFD ICMS/IPI e XML das notas, e numa memória de cálculo que um perito consiga refazer.

      Escrevi um guia completo, com exemplo hipotético de cálculo e lista de documentos. O link está no primeiro comentário.
    hashtags: ["#DireitoTributario", "#RecuperacaoTributaria", "#Contabilidade", "#PISCofins"]
    primeiro_comentario: "Guia completo do Tema 69, com fontes oficiais: https://velatrix-blog.pages.dev/blog/exclusao-icms-base-pis-cofins-tema-69/"

  - id: li-002-contador-carteira
    pilar: dor
    fonte: exclusao-icms-base-pis-cofins-tema-69
    texto: |
      Contador, uma pergunta direta:

      Quantos clientes do Lucro Real e do Presumido na sua carteira nunca tiveram a base do PIS/Cofins revisada?

      Na maioria dos escritórios, a resposta é "não sei". E não por falta de competência. Revisar exige cruzar escrituração, notas e recolhimentos de cinco anos, cliente por cliente.

      Um roteiro de diagnóstico que funciona:

      1. Verificar se o cliente já tem ação ou pedido administrativo sobre o tema, e a data do protocolo.
      2. Separar EFD-Contribuições, EFD ICMS/IPI e os XML de saída do período não prescrito.
      3. Conferir DCTF e DARF de PIS e Cofins.
      4. Conciliar a receita da ECF com a receita tributável. Divergência aqui costuma ser a primeira pista de erro de base.
      5. Recalcular mês a mês e documentar tudo, porque a compensação precisa resistir a uma fiscalização.

      Esse diagnóstico é um serviço que o próprio contador pode oferecer, com o cliente que ele já tem.

      É exatamente esse trabalho de cruzamento que estou automatizando na Velatrix: leitura de ECD, ECF e EFD com dados reais, para o profissional chegar mais rápido ao número que importa.

      Se você quer testar com a sua carteira, comente "diagnóstico" ou entre no grupo do primeiro comentário.
