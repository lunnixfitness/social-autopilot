  - id: li-003-transacao-pgfn
    pilar: educativo
    fonte: transacao-tributaria-pgfn-guia
    texto: |
      "Até 65% de desconto na transação com a PGFN."

      Essa frase aparece em todo lugar. Mas quase nunca o cliente vai ver 65% sobre a dívida dele.

      O motivo está na lei: o desconto da transação não pode alcançar o principal. Ele incide sobre multa, juros e encargos.

      Exemplo hipotético de uma inscrição de R$ 1.000.000:
      → Principal: R$ 400.000
      → Multa, juros e encargo legal: R$ 600.000
      → Teto legal (65% do total): R$ 650.000
      → Desconto máximo possível: R$ 600.000, ou seja, 60% do total

      Em dívida recente, com poucos juros acumulados, o desconto possível cai ainda mais.

      Os parâmetros gerais da Lei 13.988/2020, com as mudanças da Lei 14.375/2022:
      → até 65% de desconto e até 120 meses;
      → para pessoa física, ME e EPP, até 70% e até 145 meses;
      → o desconto concreto depende da capacidade de pagamento que a PGFN atribui ao contribuinte.

      E um ponto que pesa na decisão: a adesão é confissão irrevogável e irretratável dos débitos incluídos. Antes de aderir, vale conferir prescrição, pagamentos e ações em curso.

      Detalhei tudo, com o passo a passo no REGULARIZE, no artigo do primeiro comentário.
    hashtags: ["#DireitoTributario", "#PGFN", "#TransacaoTributaria", "#Contabilidade"]
    primeiro_comentario: "Guia da transação tributária com a PGFN: https://velatrix-blog.pages.dev/blog/transacao-tributaria-pgfn-guia/"

